
name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install sentry-sdk

    - name: 构建可执行文件
      run: |
        pyinstaller --onefile --windowed --name AdminRunner admin_tray_runner.py

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: AdminRunner-Windows
        path: dist/AdminRunner.exe

    - name: 获取标签说明
      id: tag_message
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_MESSAGE=$(git tag -l --format='%(contents)' ${GITHUB_REF#refs/tags/})
        if [ -z "$TAG_MESSAGE" ]; then
          TAG_MESSAGE="无更新说明"
        fi
        echo "message<<EOF" >> $GITHUB_OUTPUT
        echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: 创建 Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AdminRunner.exe
          run.txt
        body: |
          ## Admin Runner ${{ github.ref_name }}
          
          ### 📝 更新日志
          ${{ steps.tag_message.outputs.message }}
          
          ---
          
          ### 📦 使用说明
          1. 下载 `AdminRunner.exe` 和 `run.txt`
          2. 将两个文件放在同一目录
          3. 编辑 `run.txt`，每行添加一个要管理的程序路径
          4. 运行 `AdminRunner.exe`（会请求管理员权限）
          
          ### ✨ 功能特性
          - 自动以管理员权限启动配置的程序
          - 监控进程状态，崩溃后自动重启
          - 隐藏控制台窗口
          - Sentry 日志记录
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}